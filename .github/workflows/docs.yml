name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/web/**'
      - 'mkdocs.yml'
      - 'shakermaker/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # The package must be importable for mkdocstrings to read docstrings,
      # which means building the Fortran `shakermaker.core` extension via
      # f2py/numpy.distutils. That requires NumPy 1.x and setuptools<60 at
      # build time (see docs/web/guides/installation.md); --no-build-isolation
      # keeps pip from fetching a newer NumPy into an isolated build env.
      # pandas is a hard import of shakermaker.sl_extensions, so it must be
      # present for mkdocstrings to import the package at all.
      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install --upgrade pip
          pip install "setuptools<60.0" "numpy<2.0" wheel scipy h5py mpi4py matplotlib pandas

      - name: Install ShakerMaker (builds Fortran extension)
        run: pip install . --no-build-isolation

      - name: Install docs dependencies
        run: pip install -r docs/web/requirements-docs.txt

      - name: Build & deploy to gh-pages
        run: mkdocs gh-deploy --force

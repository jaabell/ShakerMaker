# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# Builds the MkDocs Material site under docs/web/ (see mkdocs.yml) — the same
# site deployed to GitHub Pages by .github/workflows/docs.yml. The old Sphinx
# tree under docs/source/ (pre-2.0, API docs only) is no longer built here.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # mkdocstrings needs to import shakermaker to read its docstrings, which
    # means building the Fortran shakermaker.core extension. That needs
    # NumPy 1.x + setuptools<60 at build time (numpy.distutils) and pandas is
    # a hard import of shakermaker.sl_extensions — see
    # docs/web/guides/installation.md for why.
    post_install:
      - pip install "setuptools<60.0" "numpy<2.0" wheel scipy h5py mpi4py matplotlib pandas
      - pip install . --no-build-isolation
      - pip install -r docs/web/requirements-docs.txt

mkdocs:
  configuration: mkdocs.yml
